<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Doctor Portal Login</h1>
        <p>Please enter your credentials to proceed.</p>

        <label for="doctorIdInput">Doctor ID:</label>
        <input type="text" id="doctorIdInput" placeholder="e.g., DOC789">

        <label for="doctorNameInput">Your Name:</label>
        <input type="text" id="doctorNameInput" placeholder="e.g., Dr. Sharma">

        <button id="doctorLoginBtn">Login</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
